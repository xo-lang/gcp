# This repository's additions to the shared gitleaks configuration
# (decision 0008). scripts/check-public.sh writes a configuration that
# extends the shared one ([extend] path) and appends this file, so the
# shared rules stay unchanged and strict. Each entry is one exact text
# or path with why.

[allowlist]
description = "reviewed texts (decision 0008)"
regexTarget = "match"
regexes = [
  # Cloud Asset's documentation example of a tag key query
  # (`tagKeys="123456789/env"`), in its Discovery descriptions; the
  # generic-api-key rule reads the value as a key
  '''(effectiveTagKeys|tagKeys)="123456789/env"''',
  # Vertex AI's generated field enum doc line (decision 0013), the enum
  # of the CoherenceInstance model: the cohere-api-token rule reads
  # "Coherence" and the 40-character type name after the colon as a
  # Cohere key (written with classes so this line is not that text)
  '''Coherence[I]nstanceField: GoogleCloudAiplatformV1Coherence[I]nstance''',
]
